<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>文件读取</title>

<style>

.box{

width:500px;

height:500px;

border: 1px solid #ccc;

margin:300px auto;

position: relative;

background-color:rgb(167,239,251); 

}

.file{

position: absolute;

bottom:0;

left:0;

}

#img{

position: absolute;

left:100px;

bottom:30px;

}

</style>

</head>

<body>
  <div class="series-bar">
    <div class="series-inner">
      <span class="series-title"><img class="series-logo" src="../img/jinsight-logo/logo2-1-no-grid.png" alt="JinSight logo">JinSight 竞赛系列</span>
      <span class="series-links">
        <a href="https://jinsight-cup.github.io/JinSight-ChallengeV1/">V1 广域红外小目标检测</a>
        <a href="https://jinsight-cup.github.io/JinSight-ChallengeV2/" class="series-current">V2 红外视频卫星空中动目标检测</a>
        <a href="https://jinsight-cup.github.io/JinSight-ChallengeV3/">V3 光学时敏弱小目标探测</a>
      </span>
    </div>
  </div>

<div>

<input type="file" multiple>

<img src="" alt="" id="img">

</div>

<script>

var file = document.querySelector('.file');/*获取到了文件表单元素*/

/*选择文件后触发*/

file.onchange = function () {

/*初始化了一个文件读取对象*/

var reader = new FileReader();

/*读取文件数据  this.files[0] 文件表单元素选择的第一个文件 */

reader.readAsDataURL(this.files[0]);

/* 加载 */

reader.onload = function () {

    /*读取完成显示图片*/

    console.log(this.result);

document.querySelector('#img').src = this.result;

 

}

}

</script>

</body>

</html>
